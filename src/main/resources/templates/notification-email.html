<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .notification {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #52796f;
        }
        .title {
            color: #2f3e46;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .message {
            font-size: 16px;
            color: #495057;
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #6c757d;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="notification">
        <h1 class="title" th:text="${title}">Notification Title</h1>
        <p class="message" th:text="${message}">Notification Message</p>
    </div>
    <div class="footer">
        <p>This is an automated message from your Mood Tracker app.</p>
        <p>You can manage your notification preferences in the app settings.</p>
    </div>
</body>
</html>
