# Server Configuration
server.port=8081

# PostgreSQL / Neon Configuration
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/moodtracker}}
spring.datasource.username=${DB_USERNAME:moodtracker}
spring.datasource.password=${DB_PASSWORD:moodtracker}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# JWT Configuration
jwt.secret=${JWT_SECRET:moodtracker_dev_secret_change_me}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.com.moodtracker=DEBUG
logging.level.org.springframework.security=INFO

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Firebase Configuration
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
firebase.database.url=${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}

# WebSocket Configuration
websocket.endpoint=/ws
websocket.allowed-origins=*
websocket.destination-prefix=/topic
websocket.application-prefix=/app

# Weather API Configuration
weather.api.key=${WEATHER_API_KEY:}
weather.api.url=${WEATHER_API_URL:https://api.openweathermap.org/data/2.5}

# OpenWeatherMap Configuration
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:}
openweathermap.api.url=${OPENWEATHERMAP_API_URL:http://api.openweathermap.org/data/2.5/weather}

# Task Scheduling
task.reminder.cron=0 0 8 * * *
mood.check.cron=0 0 */4 * * *

# File Storage
storage.location=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
