# Server Configuration
server.port=8081

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=moodtracker
spring.data.mongodb.authentication-database=admin

# Connection Pool and Timeout Settings
spring.data.mongodb.connect-timeout=5000
spring.data.mongodb.socket-timeout=5000
spring.data.mongodb.max-connection-pool-size=100

# Enable auto-index creation
spring.data.mongodb.auto-index-creation=true

# Logging for MongoDB
logging.level.org.springframework.data.mongodb=DEBUG

# MongoDB Initialization
spring.mongodb.embedded.version=4.0.21

# JWT Configuration
jwt.secret=${JWT_SECRET:moodtracker_dev_secret_change_me}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.com.moodtracker=DEBUG
logging.level.org.springframework.security=INFO

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Firebase Configuration
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
firebase.database.url=${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}

# WebSocket Configuration
websocket.endpoint=/ws
websocket.allowed-origins=*
websocket.destination-prefix=/topic
websocket.application-prefix=/app

# Weather API Configuration
weather.api.key=${WEATHER_API_KEY:}
weather.api.url=${WEATHER_API_URL:https://api.openweathermap.org/data/2.5}

# OpenWeatherMap Configuration
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:}
openweathermap.api.url=${OPENWEATHERMAP_API_URL:http://api.openweathermap.org/data/2.5/weather}

# Task Scheduling
task.reminder.cron=0 0 8 * * *
mood.check.cron=0 0 */4 * * *

# File Storage
storage.location=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
